<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Energy Audit App</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
          --bg: #0a0e1a;
          --card: #111827;
          --card2: #1a2235;
          --border: #1e3a5f;
          --accent: #00d4ff;
          --accent2: #ff6b35;
          --accent3: #00ff88;
          --warn: #ffcc00;
          --danger: #ff4444;
          --text: #e0eaff;
          --muted: #6b82a8;
          --home: #00d4ff;
          --comm: #ff6b35;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
          font-family: 'Exo 2', sans-serif;
          background: var(--bg);
          color: var(--text);
          min-height: 100vh;
          overflow-x: hidden;
        }
        /* BG grid */
        body::before {
          content:'';
          position:fixed; inset:0;
          background-image:
            linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
          background-size: 40px 40px;
          pointer-events:none; z-index:0;
        }

        .screen { display:none; position:relative; z-index:1; }
        .screen.active { display:block; }

        /* ===== SPLASH ===== */
        #splash {
          min-height:100vh;
          display:flex; flex-direction:column;
          align-items:center; justify-content:center;
          padding:30px 20px;
        }
        .logo-ring {
          width:120px; height:120px;
          border-radius:50%;
          border:3px solid var(--accent);
          display:flex; align-items:center; justify-content:center;
          position:relative;
          box-shadow: 0 0 30px rgba(0,212,255,0.4), inset 0 0 30px rgba(0,212,255,0.1);
          animation: pulse-ring 2s ease-in-out infinite;
          margin-bottom:24px;
        }
        .logo-ring::before {
          content:'';
          position:absolute; inset:-8px;
          border-radius:50%;
          border:1px solid rgba(0,212,255,0.2);
          animation: spin 8s linear infinite;
        }
        .logo-ring span { font-size:48px; }
        @keyframes pulse-ring {
          0%,100% { box-shadow: 0 0 30px rgba(0,212,255,0.4), inset 0 0 30px rgba(0,212,255,0.1); }
          50% { box-shadow: 0 0 60px rgba(0,212,255,0.7), inset 0 0 40px rgba(0,212,255,0.2); }
        }
        @keyframes spin { to { transform:rotate(360deg); } }

        .app-title {
          font-family:'Rajdhani',sans-serif;
          font-size:32px; font-weight:700;
          background: linear-gradient(135deg, var(--accent), var(--accent3));
          -webkit-background-clip:text; -webkit-text-fill-color:transparent;
          text-align:center; letter-spacing:2px;
        }
        .app-sub { color:var(--muted); font-size:13px; text-align:center; margin-top:6px; margin-bottom:40px; }

        .user-type-label {
          font-family:'Rajdhani',sans-serif;
          font-size:16px; color:var(--muted); text-align:center;
          text-transform:uppercase; letter-spacing:3px; margin-bottom:20px;
        }
        .type-cards { display:flex; gap:16px; width:100%; max-width:380px; }
        .type-card {
          flex:1; padding:24px 16px;
          border-radius:16px;
          border:2px solid transparent;
          cursor:pointer;
          text-align:center;
          transition:all 0.3s;
          background:var(--card);
          position:relative; overflow:hidden;
